name: Fenxiang Life
description: 'Fenxiang Life (分享生活) is a Hangzhou-based Chinese social e-commerce and
  shopping-guide platform that combines cashback rebates with AI-driven price comparison.
  It returns platform commissions to consumers as cashback and analyzes historical
  price trends across major Chinese marketplaces including Taobao, JD.com, Pinduoduo,
  Douyin, and VipShop to help shoppers save money. Founded in 2018, the company reports
  50M+ users and is backed by DCM Ventures, Xiaomi, and Toutoushidao Fund. It was added
  to the API Evangelist network as a portfolio-lead stub; the company is consumer-facing
  and publishes no public developer program, API, or documentation surface at this time.'
